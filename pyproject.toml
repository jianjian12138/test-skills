[project]
name = "universal-qa-skills"
version = "12.0.0"
description = "AI-driven Universal QA Skills (L6.0 Autonomous Quality Engineering Mesh), Dual-Mode MCP Server, Hybrid TIA, ARIA Self-Healing, and tau-bench pass^k Evals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jianjian12138" }]
dependencies = []

[project.optional-dependencies]
pro = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "playwright>=1.49.0",
    "hypothesis>=6.100.0",
    "schemathesis>=3.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
qaskills = "qaskills:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py310"
